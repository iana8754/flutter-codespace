name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Создать Flutter-проект
        run: flutter create --platforms=android --project-name weather_app --org com.example build_app

      - name: Подставить код и зависимости
        run: |
          rm -rf build_app/lib
          cp -r lib build_app/lib
          cd build_app
                    flutter pub add http geolocator intl shared_preferences

      - name: Добавить разрешения Android
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application|' build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Погода"|' build_app/android/app/src/main/AndroidManifest.xml

      - name: Собрать APK
        run: |
          cd build_app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../weather.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Версия ${{ github.run_number }}
          files: weather.apk