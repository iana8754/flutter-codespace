name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Разрешения (интернет и камера)
        run: python3 fix_manifest.py

      - name: Принудительно compileSdk 36 для плагинов
        run: python3 fix_gradle.py

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: my-cloud-apk
          path: build/app/outputs/flutter-apk/app-release.apk